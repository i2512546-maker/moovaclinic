<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - MOOVA Clinic</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-style.css') }}">
    <!-- Contentsquare - UX & Usability Testing -->
    <script src="https://t.contentsquare.com/uxa/6897c7b83eb5.js"></script>
</head>
<body>
<div class="login-bg">
    <div class="card card-moova p-4 p-sm-5 w-100" style="max-width:440px;">

        <div class="text-center mb-4">
            <div class="logo" style="font-size:1.9rem; margin-bottom:6px;">MOOVA <span>Clinic</span></div>
            <p class="text-muted mb-0">Portal de acceso al personal</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                <div class="alert alert-danger d-flex align-items-center gap-2 py-3" role="alert">
                    <i class="fas fa-exclamation-circle"></i> <span>{{ msg }}</span>
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="d-flex flex-column gap-4">
            <div>
                <label class="form-label fw-semibold d-flex align-items-center gap-2 mb-2"><i class="fas fa-envelope text-success"></i> Correo</label>
                <input type="email" name="correo" class="form-control form-control-lg" placeholder="tu@correo.com" required>
            </div>
            <div>
                <label class="form-label fw-semibold d-flex align-items-center gap-2 mb-2"><i class="fas fa-lock text-success"></i> Contraseña</label>
                <div class="input-group input-group-lg">
                    <input type="password" name="clave" id="clave" class="form-control" placeholder="••••••••" required>
                    <button type="button" class="btn btn-outline-secondary toggle-pass" onclick="togglePassword()" aria-label="Mostrar u ocultar contraseña">
                        <i class="fas fa-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-moova btn-lg rounded-pill fw-semibold">
                <i class="fas fa-sign-in-alt me-2"></i> Ingresar
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <a href="{{ url_for('index') }}" class="text-decoration-none d-inline-flex align-items-center gap-2 px-4 py-2 rounded-pill" style="color:var(--moova-muted);">
                <i class="fas fa-arrow-left"></i> Volver al inicio
            </a>
        </div>

    </div>
</div>

<script>
    function togglePassword() {
        const input = document.getElementById('clave');
        const icon  = document.getElementById('eye-icon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
