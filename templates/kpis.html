<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPIs - MOOVA Clinic</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand navbar-bubble border-bottom shadow-sm px-3 py-2">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 logo">MOOVA <span>Clinic</span></span>
        <div class="d-flex align-items-center gap-2 ms-auto flex-wrap">
            <span class="badge text-bg-light d-inline-flex align-items-center gap-1">
                <i class="bi bi-shield-lock"></i>
                {{ session.usuario_nombre }}
            </span>
            <a href="{{ url_for('panel_admin_auditoria') }}" class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1">
                <i class="bi bi-journal-text"></i> Auditoría
            </a>
            <a href="{{ url_for('panel_admin') }}" class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1">
                <i class="bi bi-person-gear"></i> Panel Admin
            </a>
            <a href="{{ url_for('index') }}" class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1">
                <i class="bi bi-house"></i> Inicio
            </a>
            <a href="{{ url_for('logout') }}" class="btn btn-sm btn-danger-moova d-inline-flex align-items-center gap-1">
                <i class="bi bi-box-arrow-right"></i> Salir
            </a>
        </div>
    </div>
</nav>

<div class="contenedor-estrecho py-4">

    <div class="mb-4">
        <h1 class="h3 d-flex align-items-center gap-2">
            <i class="bi bi-graph-up"></i> Indicadores (KPIs)
        </h1>
        <p class="text-muted mb-0">Resumen del negocio por rango de fechas. El cálculo se hace en SQL (base moovacloud_kpis).</p>
    </div>

    <div id="kpis-root" data-url="{{ url_for('panel_admin_kpis_json') }}">
        <div class="text-center text-muted py-4">
            <i class="bi bi-hourglass-split me-2"></i> Cargando indicadores…
        </div>
    </div>

    <noscript>
        <div class="alert alert-warning">Este panel necesita JavaScript activado.</div>
    </noscript>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='react/kpis.js') }}"></script>
</body>
</html>
