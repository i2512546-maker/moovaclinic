name: CI

on:
  push:
    branches: [main, branch-jarib, mejoras-sustentacion]
  pull_request:
    branches: [main, branch-jarib]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: ruff check
        run: ruff check .

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Los tests no tocan MySQL: shared.config exige SECRET_KEY y los
      # procs se parchean. API_KEY tambien porque la auth interna esta
      # cerrada sin ella.
      - name: Configurar entorno
        run: |
          echo "SECRET_KEY=clave-de-pruebas-ci" >> "$GITHUB_ENV"
          echo "API_KEY=clave-interna-ci" >> "$GITHUB_ENV"

      - name: pytest
        run: pytest -v

  audit-python:
    name: Auditoria de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  sql-estatico:
    name: Coherencia de procedimientos SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Detecta procedimientos definidos en db_split/ que el codigo nunca
      # llama, y llamadas a procedimientos inexistentes. Es el chequeo que
      # encontro los 4 procedimientos sin referencias.
      - name: Verificar que no haya procedimientos huerfanos
        run: python scripts/auditar_procs.py

  swagger:
    name: Swagger sincronizado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verificar rutas documentadas
        run: python scripts/verificar_swagger.py

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Compilar los paneles
        working-directory: frontend
        run: npm run build

      # Los bundles compilados van commiteados (Render y Docker no usan Node).
      # Si el build produce un archivo casi vacio, algo salio mal.
      - name: Verificar que los bundles no esten vacios
        run: |
          for f in kpis moovatrack; do
            tam=$(stat -c%s "static/react/$f.js")
            echo "$f.js: $tam bytes"
            test "$tam" -gt 100000
          done
