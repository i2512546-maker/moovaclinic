version: "3.8"

services:
  gateway:
    build: .
    command: python run.py
    ports:
      - "5000:5000"
    env_file: .env
    depends_on:
      - auth-service
      - pacientes-service
      - citas-service
      - pagos-service
      - notas-service
      - audit-service
    environment:
      - AUTH_SERVICE_URL=http://auth-service:5001
      - PACIENTES_SERVICE_URL=http://pacientes-service:5002
      - CITAS_SERVICE_URL=http://citas-service:5003
      - PAGOS_SERVICE_URL=http://pagos-service:5004
      - NOTAS_SERVICE_URL=http://notas-service:5005
      - AUDIT_SERVICE_URL=http://audit-service:5006
    networks:
      - moova-net

  auth-service:
    build: .
    command: python -m services.auth_service.run
    env_file: services/auth_service/.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:5001
      - PACIENTES_SERVICE_URL=http://pacientes-service:5002
      - CITAS_SERVICE_URL=http://citas-service:5003
      - PAGOS_SERVICE_URL=http://pagos-service:5004
      - NOTAS_SERVICE_URL=http://notas-service:5005
      - AUDIT_SERVICE_URL=http://audit-service:5006
    networks:
      - moova-net

  pacientes-service:
    build: .
    command: python -m services.pacientes_service.run
    env_file: services/pacientes_service/.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:5001
      - PACIENTES_SERVICE_URL=http://pacientes-service:5002
      - CITAS_SERVICE_URL=http://citas-service:5003
      - PAGOS_SERVICE_URL=http://pagos-service:5004
      - NOTAS_SERVICE_URL=http://notas-service:5005
      - AUDIT_SERVICE_URL=http://audit-service:5006
    networks:
      - moova-net

  citas-service:
    build: .
    command: python -m services.citas_service.run
    env_file: services/citas_service/.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:5001
      - PACIENTES_SERVICE_URL=http://pacientes-service:5002
      - CITAS_SERVICE_URL=http://citas-service:5003
      - PAGOS_SERVICE_URL=http://pagos-service:5004
      - NOTAS_SERVICE_URL=http://notas-service:5005
      - AUDIT_SERVICE_URL=http://audit-service:5006
    networks:
      - moova-net

  pagos-service:
    build: .
    command: python -m services.pagos_service.run
    env_file: services/pagos_service/.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:5001
      - PACIENTES_SERVICE_URL=http://pacientes-service:5002
      - CITAS_SERVICE_URL=http://citas-service:5003
      - PAGOS_SERVICE_URL=http://pagos-service:5004
      - NOTAS_SERVICE_URL=http://notas-service:5005
      - AUDIT_SERVICE_URL=http://audit-service:5006
    networks:
      - moova-net

  notas-service:
    build: .
    command: python -m services.notas_service.run
    env_file: services/notas_service/.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:5001
      - PACIENTES_SERVICE_URL=http://pacientes-service:5002
      - CITAS_SERVICE_URL=http://citas-service:5003
      - PAGOS_SERVICE_URL=http://pagos-service:5004
      - NOTAS_SERVICE_URL=http://notas-service:5005
      - AUDIT_SERVICE_URL=http://audit-service:5006
    networks:
      - moova-net

  audit-service:
    build: .
    command: python -m services.audit_service.run
    env_file: services/audit_service/.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:5001
      - PACIENTES_SERVICE_URL=http://pacientes-service:5002
