services:
  gateway:
    build: .
    command: sh -c 'exec gunicorn "gateway.app:create_app()" --bind 0.0.0.0:$${PORT:-5000} --workers 1 --threads 8 --timeout 60'
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file: .env
    environment:
      PORT: ${PORT:-5000}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:' + __import__('os').environ.get('PORT', '5000') + '/', timeout=3).status==200 else 1)\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
