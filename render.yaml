services:
  # ============================================
  # GATEWAY — Reverse proxy + sirve HTML
  # ============================================
  - type: web
    name: moova-gateway
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "gateway.app:create_app()" --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        sync: false
      - key: AUTH_SERVICE_URL
        fromService:
          name: moova-auth
          type: web
          property: hostport
      - key: PACIENTES_SERVICE_URL
        fromService:
          name: moova-pacientes
          type: web
          property: hostport
      - key: CITAS_SERVICE_URL
        fromService:
          name: moova-citas
          type: web
          property: hostport
      - key: PAGOS_SERVICE_URL
        fromService:
          name: moova-pagos
          type: web
          property: hostport
      - key: NOTAS_SERVICE_URL
        fromService:
          name: moova-notas
          type: web
          property: hostport
      - key: AUDIT_SERVICE_URL
        fromService:
          name: moova-audit
          type: web
          property: hostport

  # ============================================
  # AUTH SERVICE
  # ============================================
  - type: web
    name: moova-auth
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "services.auth_service.app:create_app()" --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: SECRET_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: moovacloud_auth
      - key: DB_PORT
        value: "3306"
      - key: OTP_EXPIRA_MIN
        value: "10"
      - key: OTP_MAX_INTENTOS
        value: "3"
      - key: MAX_INTENTOS_IP
        value: "3"
      - key: TIEMPO_BLOQUEO
        value: "2"

