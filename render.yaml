        value: "3.11.8"
      - key: SECRET_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: moovacloud_pacientes
      - key: DB_PORT
        value: "3306"
      - key: APIPERU_TOKEN
        sync: false
      - key: APIPERU_URL
        value: "https://dniruc.apisperu.com/api/v1/dni/{dni}?token={token}"
      - key: AUTH_SERVICE_URL
        fromService:
          name: moova-auth
          type: web
          property: hostport
      - key: CITAS_SERVICE_URL
        fromService:
          name: moova-citas
          type: web
          property: hostport
      - key: PAGOS_SERVICE_URL
